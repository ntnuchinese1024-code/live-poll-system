<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>控制台 — 即時互動系統</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#eef1f6; --muted:#9aa3b2; --accent:#6ea8fe; --accent2:#22c55e;
    --danger:#f87171; --warn:#fbbf24; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;zoom:1.25;}
  #loginGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;}
  #loginGate .box{background:var(--panel);padding:32px;border-radius:var(--radius);border:1px solid var(--border);width:300px;text-align:center;}
  #loginGate input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);margin:12px 0;font-size:15px;}
  #loginGate button{width:100%;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#08101f;font-weight:600;cursor:pointer;}
  #loginGate .err{color:var(--danger);font-size:13px;min-height:18px;}

  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;}
  header h1 span{color:var(--accent);}
  .session-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .session-controls input{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;width:140px;}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#08101f;border-color:var(--accent);font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08);color:#08101f;}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{border-color:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px;max-width:1400px;margin:0 auto;}
  @media(max-width:920px){ main{grid-template-columns:1fr;} }

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .card h2{margin:0 0 14px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}

  .qlist{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .qitem{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
  .qitem.active{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2);}
  .qitem .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#2a2f3a;color:var(--muted);white-space:nowrap;}
  .qitem .tag.live{background:rgba(34,197,94,.15);color:var(--accent2);}
  .qitem .title{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qitem .count{font-size:12px;color:var(--muted);white-space:nowrap;}
  .qitem .actions{display:flex;gap:6px;}

  form.newq{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  .type-select{display:flex;gap:8px;}
  .type-select label{flex:1;text-align:center;padding:10px 6px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;background:var(--panel2);}
  .type-select input{display:none;}
  .type-select input:checked + span{color:var(--accent);font-weight:700;}
  .type-select label:has(input:checked){border-color:var(--accent);}
  input[type=text], textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit;}
  .opt-row{display:flex;gap:6px;}
  .opt-row input{flex:1;}
  .opts{display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;gap:10px;align-items:center;}
  .checkline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}

  .qa-mod{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
  .qa-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .qa-card.pending{border-color:var(--warn);}
  .qa-card .txt{font-size:14px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;}
  .qa-card .meta{display:flex;gap:6px;justify-content:flex-end;}

  .settings-grid{display:flex;flex-direction:column;gap:14px;}
  .radio-group{display:flex;gap:8px;}
  .radio-group label{flex:1;text-align:center;padding:8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;}
  .radio-group input{display:none;}
  .radio-group label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:700;background:rgba(110,168,254,.08);}
  input[type=range]{width:100%;}
  .link-box{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);word-break:break-all;}
  .qr-preview{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:8px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--accent2);color:var(--text);padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loginGate">
  <div class="box">
    <h2 style="margin-top:0">控制台登入</h2>
    <input type="password" id="pwInput" placeholder="請輸入管理密碼" />
    <button class="btn primary" id="pwSubmit">進入</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<header>
  <h1>🎛️ 即時互動系統 — <span>控制台</span></h1>
  <div class="session-controls">
    <span style="font-size:12px;color:var(--muted)">場次代碼</span>
    <input type="text" id="sessionInput" />
    <button class="btn small" id="switchSessionBtn">切換</button>
    <button class="btn small" id="newSessionBtn">建立新場次</button>
  </div>
</header>

<main>
  <div>
    <div class="card">
      <h2>題目列表 <span id="qCountLabel" style="font-weight:400;text-transform:none;font-size:12px"></span></h2>
      <div class="qlist" id="qlist"><div class="empty">尚無題目，請於下方新增</div></div>

      <form class="newq" id="newQForm">
        <div class="type-select">
          <label><input type="radio" name="qtype" value="wordcloud" checked /><span>☁️ 文字雲</span></label>
          <label><input type="radio" name="qtype" value="poll" /><span>📊 投票</span></label>
          <label><input type="radio" name="qtype" value="qa" /><span>💬 留言板</span></label>
        </div>
        <input type="text" id="qTitle" placeholder="輸入題目 / 問題文字" maxlength="120" required />

        <div id="pollOptsWrap" style="display:none">
          <div class="opts" id="pollOpts">
            <div class="opt-row"><input type="text" class="optInput" placeholder="選項 1" maxlength="60" /></div>
            <div class="opt-row"><input type="text" class="optInput" placeholder="選項 2" maxlength="60" /></div>
          </div>
          <div class="row" style="margin-top:8px">
            <button type="button" class="btn small" id="addOptBtn">＋ 新增選項</button>
            <label class="checkline"><input type="checkbox" id="multiCheck" /> 允許複選</label>
          </div>
        </div>

        <button type="submit" class="btn primary">新增題目</button>
      </form>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>目前進行中</h2>
      <div id="activeInfo" class="empty">目前沒有啟用中的題目</div>
    </div>

    <div class="card" id="qaModCard" style="display:none">
      <h2>留言板審核 <label class="checkline" style="font-weight:400"><input type="checkbox" id="autoApproveChk" /> 自動核准</label></h2>
      <div class="qa-mod" id="qaMod"><div class="empty">尚無留言</div></div>
    </div>

    <div class="card">
      <h2>簡報呈現設定</h2>
      <div class="settings-grid">
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">QR Code 位置</div>
          <div class="radio-group" id="qrPosGroup">
            <label><input type="radio" name="qrpos" value="left" /> 左側</label>
            <label><input type="radio" name="qrpos" value="right" checked /> 右側</label>
            <label><input type="radio" name="qrpos" value="top" /> 頂端</label>
          </div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">
            QR 區域佔比：<span id="qrRatioVal">25</span>%
          </div>
          <input type="range" id="qrRatioRange" min="12" max="45" value="25" />
        </div>
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">觀眾端網址（QR Code 內容）</div>
          <div class="link-box" id="audienceLinkBox">—</div>
          <div class="qr-preview" id="qrPreview" style="margin-top:8px"></div>
        </div>
        <div class="row">
          <button class="btn small" id="copyAudienceBtn">複製觀眾端連結</button>
          <button class="btn small" id="copyDisplayBtn">複製簡報端連結</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- 密碼保護 ----------
const gate = document.getElementById('loginGate');
if (localStorage.getItem('lps_admin_ok') === '1') gate.style.display = 'none';
document.getElementById('pwSubmit').onclick = tryLogin;
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
function tryLogin() {
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD) {
    localStorage.setItem('lps_admin_ok', '1');
    gate.style.display = 'none';
  } else {
    document.getElementById('pwErr').textContent = '密碼錯誤';
  }
}

// ---------- 場次 ----------
let sessionId = getSessionId();
document.getElementById('sessionInput').value = sessionId;
document.getElementById('switchSessionBtn').onclick = () => {
  const v = sanitizeInput(document.getElementById('sessionInput').value, 40);
  if (!v) return;
  location.search = '?session=' + encodeURIComponent(v);
};
document.getElementById('newSessionBtn').onclick = () => {
  const v = 'S' + Math.random().toString(36).slice(2, 7).toUpperCase();
  location.search = '?session=' + encodeURIComponent(v);
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

const sessRef = db.ref('sessions/' + sessionId);
const questionsRef = sessRef.child('questions');
const activeRef = sessRef.child('activeQuestionId');
const settingsRef = sessRef.child('settings');
const responsesRef = sessRef.child('responses');

// ---------- 觀眾 / 簡報連結 ----------
const audienceUrl = buildAudienceUrl(sessionId);
const displayUrl = new URL('display.html', location.href);
displayUrl.searchParams.set('session', sessionId);

document.getElementById('audienceLinkBox').textContent = audienceUrl;
document.getElementById('copyAudienceBtn').onclick = () => { navigator.clipboard.writeText(audienceUrl); toast('已複製觀眾端連結'); };
document.getElementById('copyDisplayBtn').onclick = () => { navigator.clipboard.writeText(displayUrl.toString()); toast('已複製簡報端連結'); };

const qrPreviewEl = document.getElementById('qrPreview');
if (typeof QRCode !== 'undefined') {
  new QRCode(qrPreviewEl, { text: audienceUrl, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M });
} else {
  qrPreviewEl.textContent = 'QR 套件載入失敗，請確認網路後重新整理';
  qrPreviewEl.style.cssText = 'color:#333;font-size:12px;padding:10px;';
}

// ---------- 新增題目 ----------
const typeRadios = document.querySelectorAll('input[name=qtype]');
const pollOptsWrap = document.getElementById('pollOptsWrap');
typeRadios.forEach(r => r.addEventListener('change', () => {
  pollOptsWrap.style.display = (r.checked && r.value === 'poll') ? 'block' : (document.querySelector('input[name=qtype]:checked').value === 'poll' ? 'block' : 'none');
}));
document.getElementById('addOptBtn').onclick = () => {
  const wrap = document.getElementById('pollOpts');
  if (wrap.children.length >= 8) { toast('最多 8 個選項'); return; }
  const div = document.createElement('div');
  div.className = 'opt-row';
  div.innerHTML = `<input type="text" class="optInput" placeholder="選項 ${wrap.children.length + 1}" maxlength="60" />`;
  wrap.appendChild(div);
};

document.getElementById('newQForm').addEventListener('submit', e => {
  e.preventDefault();
  const type = document.querySelector('input[name=qtype]:checked').value;
  const title = sanitizeInput(document.getElementById('qTitle').value, 120);
  if (!title) return;
  const q = { type, title, createdAt: firebase.database.ServerValue.TIMESTAMP };
  if (type === 'poll') {
    const opts = Array.from(document.querySelectorAll('.optInput')).map(i => sanitizeInput(i.value, 60)).filter(Boolean);
    if (opts.length < 2) { toast('投票至少需要 2 個選項'); return; }
    q.options = opts;
    q.multi = document.getElementById('multiCheck').checked;
  }
  const newRef = questionsRef.push();
  newRef.set(q).then(() => {
    toast('已新增題目');
    document.getElementById('newQForm').reset();
    pollOptsWrap.style.display = 'none';
    document.getElementById('pollOpts').innerHTML = '<div class="opt-row"><input type="text" class="optInput" placeholder="選項 1" maxlength="60" /></div><div class="opt-row"><input type="text" class="optInput" placeholder="選項 2" maxlength="60" /></div>';
  });
});

// ---------- 題目列表 ----------
let questionsCache = {};
let activeId = null;

questionsRef.on('value', snap => {
  questionsCache = snap.val() || {};
  renderQList();
  renderActiveInfo();
});
activeRef.on('value', snap => {
  activeId = snap.val() || null;
  renderQList();
  renderActiveInfo();
});

const typeLabel = { wordcloud: '☁️ 文字雲', poll: '📊 投票', qa: '💬 留言板' };

const countListeners = {}; // qid -> true，避免每次重繪重複註冊監聽
function renderQList() {
  const list = document.getElementById('qlist');
  const ids = Object.keys(questionsCache).sort((a, b) => (questionsCache[a].createdAt || 0) - (questionsCache[b].createdAt || 0));
  document.getElementById('qCountLabel').textContent = ids.length ? `共 ${ids.length} 題` : '';

  Object.keys(countListeners).forEach(qid => {
    if (!ids.includes(qid)) { responsesRef.child(qid).off('value'); delete countListeners[qid]; }
  });

  if (!ids.length) { list.innerHTML = '<div class="empty">尚無題目，請於下方新增</div>'; return; }
  list.innerHTML = '';
  ids.forEach(id => {
    const q = questionsCache[id];
    const isActive = id === activeId;
    const div = document.createElement('div');
    div.className = 'qitem' + (isActive ? ' active' : '');
    div.innerHTML = `
      <span class="tag ${isActive ? 'live' : ''}">${typeLabel[q.type] || q.type}</span>
      <span class="title">${escapeHTML(q.title)}</span>
      <span class="count" data-count="${id}"></span>
      <span class="actions">
        <button class="btn small ${isActive ? '' : 'primary'}" data-act="toggle" data-id="${id}">${isActive ? '停用' : '啟用'}</button>
        <button class="btn small danger" data-act="clear" data-id="${id}">清空回應</button>
        <button class="btn small danger" data-act="del" data-id="${id}">刪除</button>
      </span>`;
    list.appendChild(div);
    if (!countListeners[id]) {
      countListeners[id] = true;
      responsesRef.child(id).on('value', s => {
        const n = s.val() ? Object.keys(s.val()).length : 0;
        const el = list.querySelector(`[data-count="${id}"]`);
        if (el) el.textContent = n + ' 則回應';
      });
    }
  });
}

document.getElementById('qlist').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  if (act === 'toggle') {
    activeRef.set(id === activeId ? null : id);
  } else if (act === 'clear') {
    if (confirm('確定要清空此題目的所有回應嗎？')) responsesRef.child(id).remove();
  } else if (act === 'del') {
    if (confirm('確定要刪除此題目（含所有回應）嗎？此動作無法復原。')) {
      questionsRef.child(id).remove();
      responsesRef.child(id).remove();
      if (id === activeId) activeRef.set(null);
    }
  }
});

// ---------- 目前進行中 + QA 審核 ----------
let currentResponsesRef = null;
function renderActiveInfo() {
  const info = document.getElementById('activeInfo');
  const qaCard = document.getElementById('qaModCard');
  if (currentResponsesRef) { currentResponsesRef.off(); currentResponsesRef = null; }

  if (!activeId || !questionsCache[activeId]) {
    info.className = 'empty';
    info.textContent = '目前沒有啟用中的題目';
    qaCard.style.display = 'none';
    return;
  }
  const q = questionsCache[activeId];
  info.className = '';
  info.innerHTML = `<div style="font-weight:700;font-size:15px;margin-bottom:4px">${typeLabel[q.type]}</div><div style="color:var(--muted);font-size:14px">${escapeHTML(q.title)}</div>`;

  if (q.type === 'qa') {
    qaCard.style.display = 'block';
    currentResponsesRef = responsesRef.child(activeId);
    currentResponsesRef.on('value', snap => renderQaMod(snap.val() || {}));
  } else {
    qaCard.style.display = 'none';
  }
}

function renderQaMod(items) {
  const wrap = document.getElementById('qaMod');
  const ids = Object.keys(items).sort((a, b) => (items[b].ts || 0) - (items[a].ts || 0));
  if (!ids.length) { wrap.innerHTML = '<div class="empty">尚無留言</div>'; return; }
  wrap.innerHTML = '';
  ids.forEach(id => {
    const it = items[id];
    const div = document.createElement('div');
    div.className = 'qa-card' + (it.approved ? '' : ' pending');
    div.innerHTML = `
      <div class="txt">${escapeHTML(it.text)}</div>
      <div class="meta">
        ${it.approved ? '' : `<button class="btn small primary" data-act="approve" data-id="${id}">核准</button>`}
        <button class="btn small" data-act="pin" data-id="${id}">${it.pinned ? '取消釘選' : '釘選'}</button>
        <button class="btn small danger" data-act="hide" data-id="${id}">刪除</button>
      </div>`;
    wrap.appendChild(div);
  });
}
document.getElementById('qaMod').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || !currentResponsesRef) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  if (act === 'approve') currentResponsesRef.child(id).update({ approved: true });
  else if (act === 'pin') currentResponsesRef.child(id).child('pinned').once('value').then(s => currentResponsesRef.child(id).update({ pinned: !s.val() }));
  else if (act === 'hide') { if (confirm('刪除此留言？')) currentResponsesRef.child(id).remove(); }
});

// ---------- 顯示設定 ----------
document.getElementById('autoApproveChk').addEventListener('change', e => {
  settingsRef.update({ autoApproveQA: e.target.checked });
});
document.querySelectorAll('#qrPosGroup input').forEach(r => r.addEventListener('change', () => {
  settingsRef.update({ qrPosition: r.value });
}));
document.getElementById('qrRatioRange').addEventListener('input', e => {
  document.getElementById('qrRatioVal').textContent = e.target.value;
});
document.getElementById('qrRatioRange').addEventListener('change', e => {
  settingsRef.update({ qrRatio: Number(e.target.value) });
});

settingsRef.on('value', snap => {
  const s = snap.val() || {};
  if (s.qrPosition) document.querySelector(`#qrPosGroup input[value="${s.qrPosition}"]`).checked = true;
  if (s.qrRatio) {
    document.getElementById('qrRatioRange').value = s.qrRatio;
    document.getElementById('qrRatioVal').textContent = s.qrRatio;
  }
  document.getElementById('autoApproveChk').checked = s.autoApproveQA !== false;
});
</script>
</body>
</html>
